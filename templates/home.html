{% extends "base.html" %}
{% block content %}

    <h1>Book List</h1>
    {% for book in books %}
    <div>
        {% if book.cover_image_url %}
        <img src="{{ book.cover_image_url }}" alt="Cover of {{ book.title }}">
        {% endif %}
        <h3>{{ book.title }}, {{ book.author.name }}</h3>
    </div>
    {% endfor %}

{% endblock %}
